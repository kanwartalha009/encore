# Shopify Flow ACTION — "Tag order".
# Lets merchants extend Encore from Flow without code: any workflow can add a
# tag to an order. Flow POSTs to runtime_url; app/routes/flow.tag-order.tsx
# verifies the HMAC and calls tagsAdd (idempotent — safe for Flow retries).
#
# runtime_url must match application_url in shopify.app.toml. The CLI does NOT
# auto-rewrite this — ⇒ DEPLOY STEP: set it to the production URL before `deploy`.
# See DEPLOY-CHECKLIST.md ("Production URLs"). Dev default below.

[[extensions]]
name = "Encore — Tag order"
type = "flow_action"
handle = "encore-tag-order"
uid = "300ae3bc-6a8e-f395-1d1c-f0143b0a59d5d5fe4fc0"
description = "Add a tag to an order — e.g. route a pre-order to a 3PL or mark deposit-paid orders for follow-up."
runtime_url = "https://encore-production-7c8f.up.railway.app/flow/tag-order"

[settings]

  [[settings.fields]]
  type = "order_reference"
  required = true

  [[settings.fields]]
  type = "single_line_text_field"
  key = "tag"
  name = "Tag"
  description = "The tag to add to the order."
  required = true
