# Named to match the generated type the source imports
# (CartValidationsGenerateRunInput) and to avoid colliding with the schema's
# own `Input` type in generated/api.ts (tsc TS2300 on 2026-09-01).
query CartValidationsGenerateRunInput {
  cart {
    lines {
      id
      quantity
      # Preorder markers: the storefront always sets `_preorder` on preorder
      # lines, and preorder lines carry Encore's selling plan. Only marked lines
      # are capped, so ordinary in-stock purchases of the same variant are never
      # blocked (e.g. after a restock while the campaign is still live).
      preorder: attribute(key: "_preorder") {
        value
      }
      sellingPlanAllocation {
        sellingPlan {
          id
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          # Maintained by the app (preorder-cap.server.ts). Only capped preorder
          # variants have this metafield, so its presence gates the check.
          remaining: metafield(namespace: "encore", key: "preorder_remaining") {
            value
          }
          product {
            title
          }
        }
      }
    }
  }
}
