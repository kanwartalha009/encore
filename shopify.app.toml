# Encore — Preorder Novafied (Polaris-React app on the Nova Apps Platform).
# Keeps encore's Partner-app identity (client_id, app proxy) over the Novafied codebase.
# api_version pinned to 2026-07 (latest stable, Sept 2026) to match app/shopify.server.ts
# (ApiVersion.July26). 2025-10 leaves support on 2026-10-01 (12-month rule).

client_id = "98895e8868ecb5c8555ab43039b554e1"
name = "Encore"
application_url = "https://encore-production-7c8f.up.railway.app"
embedded = true

[access_scopes]
# Products/selling-plans, orders tagging, customers, markets/inventory, theme embed,
# plus metaobjects (Novafied stores per-variant pre-order config as metaobjects/metafields),
# write_validations: activate the preorder-cap Cart & Checkout Validation (validationCreate).
scopes = "read_products,write_products,write_purchase_options,read_inventory,read_locations,read_orders,write_orders,read_markets,read_customers,read_themes,read_discounts,write_metaobjects,write_metaobject_definitions,write_validations"

[auth]
redirect_urls = [ "https://encore-production-7c8f.up.railway.app/auth/callback" ]

[webhooks]
api_version = "2026-07"

# Lifecycle — handled app-locally AND forwarded to the Nova ingress (billing source of truth, §5).
[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
topics = [ "app/scopes_update" ]
uri = "/webhooks/app/scopes_update"

# Restock signal for back-in-stock. products/update carries no PCD, so it runs
# without Protected Customer Data approval (unlike orders/*).
[[webhooks.subscriptions]]
topics = [ "products/update" ]
uri = "/webhooks/products/update"

# Per-market reconciliation signal (non-PCD).
[[webhooks.subscriptions]]
topics = [ "inventory_levels/update" ]
uri = "/webhooks/inventory_levels/update"

# Billing lifecycle — forwarded to the Nova ingress (billing source of truth, §5.2):
# this is how charges → commissions are derived in the platform ledger.
[[webhooks.subscriptions]]
topics = [ "app_subscriptions/update" ]
uri = "/webhooks/app_subscriptions/update"

# Mandatory GDPR / privacy-compliance webhooks (Phase 4). `authenticate.webhook`
# verifies the HMAC and returns 401 on a bad signature; handlers purge/export by
# shopId + email (app/services/gdpr.server.ts). Required before App Store submission.
[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request" ]
uri = "/webhooks/customers/data_request"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/redact" ]
uri = "/webhooks/customers/redact"

[[webhooks.subscriptions]]
compliance_topics = [ "shop/redact" ]
uri = "/webhooks/shop/redact"

# orders/* carry Protected Customer Data. On a development store the app only needs the
# PCD request + Data protection details completed in the Partner Dashboard (no review):
# https://shopify.dev/docs/apps/launch/protected-customer-data — "If your app is for testing
# or installed only on a development store, you can access customer data in development
# after Step 5. You don't need to submit for review." `shopify app deploy` refuses these
# topics until that is done. orders/create records PreOrders, tags the order, writes the
# encore.is_preorder / encore.ship_date metafields and re-evaluates caps + continue-selling.
[[webhooks.subscriptions]]
topics = [ "orders/create" ]
uri = "/webhooks/orders/create"

[[webhooks.subscriptions]]
topics = [ "orders/paid" ]
uri = "/webhooks/orders/paid"

[[webhooks.subscriptions]]
topics = [ "orders/cancelled" ]
uri = "/webhooks/orders/cancelled"

# Storefront endpoints behind the app proxy (App-Embed-only architecture; PRD wedge 4).
[app_proxy]
url = "https://encore-production-7c8f.up.railway.app/proxy"
subpath = "encore"
prefix = "apps"

[build]
automatically_update_urls_on_dev = true
